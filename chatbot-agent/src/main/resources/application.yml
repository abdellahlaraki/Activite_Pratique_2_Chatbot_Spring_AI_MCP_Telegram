server:
  port: 8087

spring:
  application:
    name: chatbot-agent
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
          temperature: 0.2
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    mcp:
      client:
        type: SYNC
        request-timeout: 30s
        streamable-http:
          connections:
            business-tools:
              url: ${MCP_SERVER_URL:http://localhost:8989}
              endpoint: /mcp

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

telegram:
  bot:
    enabled: ${TELEGRAM_BOT_ENABLED:false}
    username: ${TELEGRAM_BOT_USERNAME:}
    token: ${TELEGRAM_BOT_TOKEN:}

rag:
  documents-directory: ${RAG_DOCUMENTS_DIRECTORY:./data/documents}
  index-on-startup: ${RAG_INDEX_ON_STARTUP:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
